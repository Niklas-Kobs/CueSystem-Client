<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Queue System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>Queue System</h1>
        </header>

        <main>
        <div class="dashboard-header">
            <section class="form-section">
                <h2>Add new Patient</h2>
                <div class="input-grid patient-grid">
                    <input type="text" id="p_name" placeholder="Name eingeben..." class="rounded-input">
                    <input type="text" id="p_id" placeholder="ID eingeben..." class="rounded-input">
                    <input type="text" id="p_room" placeholder="Raum eingeben..." class="rounded-input">
                    
                    <textarea id="p_infos" placeholder="Infos eingeben..." class="rounded-input span-2-rows"></textarea>
                    
                    <select id="p_doctor" class="rounded-input">
                        <option value="" disabled selected hidden>Arzt auswählen...</option>
                        <option value="">Arzt auswählen...</option>
                        <option value="Dr. Fürst">Dr. Fürst</option>
                        <option value="Dr. Müller">Dr. Müller</option>
                        <option value="Dr. Schmidt">Dr. Schmidt</option>
                        <option value="Dr. Weber">Dr. Weber</option>
                    </select>
                    <div class="duration-input-container">
                        <h3>Dauer (min)</h3>
                        <div class="number-input-container">
                            <button type="button" onclick="changeValue_duration(-5)" class="num-btn btn-left">-</button>
                            <input type="number" id="p_duration" value="0" class="num-input">
                            <button type="button" onclick="changeValue_duration(5)" class="num-btn btn-right">+</button>
                        </div>
                    </div>
                    
                    
                    <div class="button-group">
                        <button class="btn-main" onclick="addToQueue()">Add to list</button>
                        <button class="btn-2" onclick="addToPos()">Add to position</button>
                        <div class="number-input-container">
                            <button type="button" onclick="changeValue_pos(-1)" class="num-btn btn-left">-</button>
                            <input type="number" id="p_pos" value="1" class="num-input">
                            <button type="button" onclick="changeValue_pos(1)" class="num-btn btn-right">+</button>
                        </div>
                    </div>
                </div>
            </section>

            <section class="form-section">
                <h2>Post Message</h2>
                <div class="input-grid message-grid">
                    <input type="text" id="m_title" placeholder="Überschrift eingeben..." class="rounded-input">
                    <select id="p_template" class="rounded-input" onchange="applyTemplate()">
                        <option value="" disabled selected hidden>Nachricht auswählen...</option>
                        <option value="none">Nachricht auswählen...</option>
                        <option value="termin">Terminerinnerung</option>
                        <option value="rezept">Rezept abholbereit</option>
                        <option value="labor">Laborwerte da</option>
                    </select>
                    
                    <textarea id="m_text" placeholder="Text eingeben..." class="rounded-input span-all-cols message-area"></textarea>
                    
                    <div class="button-group span-all-cols">
                        <button class="btn-main" onclick="postMsg()">Post</button>
                        <button class="btn-2" onclick="removeMsg()">Remove</button>
                    </div>
                </div>
            </section>
        </div>

            <section class="table-container">
                <table>
                    <thead>
                        <tr class="head-table">
                            <th>Position</th>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Raum</th>
                            <th>Aktion</th>
                        </tr>
                    </thead>
                    <tbody id="queueTableBody">
                        </tbody>
                </table>
            </main>
        </main>
            <div class="dashboard-footer">
                <div class="dashboard-button-1">
                    <th><button class="btn-main" onclick="openPopup_Opt()">Optionen</button></th>
                    <th><button class="btn-2"  onclick="openQueue()">Open Queue</button></th>
                    <th><button class="btn-main" onclick="clearAll()">Clear all</button></th>
                </div>
                <div class="dashboard-button-2">
                    <th><button class="btn-2">Call</button></th>
                    <th><button class="btn-main" onclick="refresh()">Aktualisieren</button></th>
                </div>
            </div>
    </div>

    <dialog id="POPUP" class="POPUP">
        <div class="dashboard-header">
            <section class="form-section">
                <h2>Patient Information</h2>
                    <div class="input-grid patient-grid">
                        <input type="text" id="p_name_POP" placeholder="Name eingeben..." class="rounded-input">
                        <input type="text" id="p_id_POP" placeholder="ID eingeben..." class="rounded-input">
                        <input type="text" id="p_room_POP" placeholder="Raum eingeben..." class="rounded-input">
                        
                        <textarea id="p_infos_POP" placeholder="Infos eingeben..." class="rounded-input span-2-rows"></textarea>
                        
                        <select id="p_doctor_POP" class="rounded-input">
                            <option value="" disabled selected hidden>Arzt auswählen...</option>
                            <option value="">Arzt auswählen...</option>
                            <option value="Dr. Fürst">Dr. Fürst</option>
                            <option value="Dr. Müller">Dr. Müller</option>
                            <option value="Dr. Schmidt">Dr. Schmidt</option>
                            <option value="Dr. Weber">Dr. Weber</option>
                        </select>
                        <div class="duration-input-container">
                            <h3>Dauer (min)</h3>
                            <div class="number-input-container">
                                <button type="button" onclick="changeValue_duration_POP(-5)" class="num-btn btn-left">-</button>
                                <input type="number" id="p_duration_POP" value="0" class="num-input">
                                <button type="button" onclick="changeValue_duration_POP(5)" class="num-btn btn-right">+</button>
                            </div>
                        </div>
                        <div>
                            <button class="btn-main" onclick="savePopup()">Save</button>
                            <button class="btn-2" onclick="closePopup()">Close</button>
                        </div>
                    </div>
            </section>
    </dialog>

    <dialog id="POPUP_Option" class="POPUP">
        <div>
                <h2>Optionen</h2>
                <div class="option-container">
                    <button class="btn-main">Option 1</button>
                    <button class="btn-2">Option 2</button>
                    <button class="btn-main" onclick="refresh()">Test</button>
                    <button class="btn-main" onclick="closePopup_Opt()">Close</button>
                </div>
        </div>
    </dialog>

    <dialog id="CONFIRM_DELETE_POP" class="POPUP" style="max-width: 400px; text-align: center;">
        <div style="padding: 20px;">
            <h2>Sind Sie sicher?</h2>
            <p>Möchten Sie wirklich die gesamte Warteliste löschen? Dieser Vorgang kann nicht rückgängig gemacht werden.</p>
            
            <div class="button-group" style="justify-content: center; gap: 20px; margin-top: 20px;">
                <button class="btn-main" onclick="executeClearAll()">Ja, alles löschen</button>
                <button class="btn-2" onclick="closeConfirmPopup()">Abbrechen</button>
            </div>
        </div>
    </dialog>

    <dialog id="Alert_POP" class="POPUP" style="max-width: 400px; text-align: center;">
        <div style="padding: 20px;">
            <h2 id="Headline_alert" class="Headline_alert">---</h2>
            <span id="Message_alert" class="Message_alert">---</span>
            <div class="button-group" style="justify-content: center; gap: 20px; margin-top: 20px;">
                <button class="btn-main" onclick="closeAlert_Popup()">Verstanden</button>
            </div>
        </div>
    </dialog>

    <script src="script.js"></script>
</body>
</html>
